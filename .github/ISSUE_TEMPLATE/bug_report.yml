name: 问题反馈
description: 报告可复现的程序问题
title: "[问题] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        请勿上传录音、逐字稿、API 密钥、访问令牌或其他私人数据。安全漏洞请私下报告，不要公开提交。
  - type: input
    id: version
    attributes:
      label: 应用版本
      placeholder: 例如 0.2.33
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: 操作系统和设备
      placeholder: 例如 Windows 11 x64，NVIDIA RTX 4060
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 请写出最短的复现步骤。
      placeholder: |
        1. 打开应用
        2. ……
        3. ……
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 脱敏后的错误信息
      description: 删除文件路径中的个人姓名、API 密钥、令牌及会议内容后再粘贴。
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认
      options:
        - label: 我确认没有附上录音、逐字稿、API 密钥或其他私人数据。
          required: true
