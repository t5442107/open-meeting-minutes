name: 功能建议
description: 提出一个具体的改进建议
title: "[功能建议] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 你希望解决什么问题？
      description: 描述当前使用场景和遇到的困难。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 你建议如何改进？
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 你考虑过的其他方案
